<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manhwa Radar</title>
<meta name="description" content="Find, filter and track Korean manhwa with live AniList data.">
<meta name="theme-color" content="#14151b">
<!--
  Manhwa Radar — a single-file manhwa finder and tracker.
  Data: live from the public AniList GraphQL API (https://anilist.co). Covers load from AniList's image CDN.
  Your list is stored in this browser (localStorage). Use Data → Export to back it up or move it to another device.
  Run it: open this file in a browser, or host it anywhere static (GitHub Pages, Netlify, Vercel).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://graphql.anilist.co">
<link rel="preconnect" href="https://s4.anilist.co">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f3f4f8; --surface:#ffffff; --sunk:#e9ebf2; --ink:#14151b; --muted:#5b6070; --line:#dcdfe8;
  --accent:#2b3dff; --accent-ink:#ffffff; --hot:#ff5320; --good:#13895a;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e0f14; --surface:#171920; --sunk:#1f222b; --ink:#eceef5; --muted:#9aa0b2; --line:#2a2e3a;
  --accent:#8590ff; --accent-ink:#0e0f14; --hot:#ff7a45; --good:#3fc58a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e0f14; --surface:#171920; --sunk:#1f222b; --ink:#eceef5; --muted:#9aa0b2; --line:#2a2e3a;
  --accent:#8590ff; --accent-ink:#0e0f14; --hot:#ff7a45; --good:#3fc58a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.mast-row{display:flex;align-items:center;gap:10px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0;flex-wrap:wrap}
.brand h1{margin:0;font:900 30px/1 var(--display);font-stretch:68%;letter-spacing:-.01em;text-transform:uppercase}
.brand h1 b{color:var(--accent)}
.brand small{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.spin-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);
  padding:10px 18px 10px 12px;font:800 15px var(--display);font-stretch:90%;letter-spacing:.02em;text-transform:uppercase}
.spin-btn:hover{background:var(--accent);color:var(--accent-ink)}
.spin-btn svg{width:24px;height:24px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted);display:flex;gap:7px;align-items:baseline}
.tab .ko{font:700 12px var(--body);opacity:.75}
.tab .en{font:700 15px var(--display);font-stretch:85%;text-transform:uppercase;letter-spacing:.02em}
.tab .n{font:11px var(--mono)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* filters */
.filters{display:grid;gap:12px;padding-block:18px 6px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;min-width:0}
.ctl{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 4px 0 10px}
.ctl label{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ctl select{border:0;background:none;padding:9px 4px;outline:none;max-width:44vw}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.meta-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted);padding-block:8px 14px}
.linklike{border:0;background:none;color:var(--accent);font:inherit;padding:0}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px}

/* grid of covers */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 16px;padding-bottom:28px}
.card{display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:0;text-align:left;min-width:0}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:8px;overflow:hidden;background:var(--c);color:var(--ci);
  padding:12px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate;transition:transform .18s ease}
.cover::before{content:"";position:absolute;inset:0;z-index:-2;
  background:repeating-linear-gradient(180deg,transparent 0 22px,rgb(255 255 255/.07) 22px 23px),linear-gradient(160deg,rgb(255 255 255/.18),transparent 45%,rgb(0 0 0/.28))}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:0;transition:opacity .25s}
.cover img.ok{opacity:1}
.cover.has-img::after{content:"";position:absolute;inset:auto 0 0;height:48%;z-index:-1;background:linear-gradient(transparent,rgb(0 0 0/.72))}
.cover.has-img{color:#fff}
.cover.has-img .ttl{visibility:hidden}
.card:hover .cover,.card:focus-visible .cover{transform:translateY(-3px)}
.cover .ttl{font:900 21px/0.98 var(--display);font-stretch:66%;text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cover .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.rank{font:900 46px/.8 var(--display);font-stretch:62%;letter-spacing:-.03em;text-shadow:0 2px 10px rgb(0 0 0/.25)}
.rank sup{font-size:.36em;vertical-align:top;margin-right:1px;opacity:.85}
.st{font:700 11px var(--body);padding:3px 7px;border-radius:999px;background:rgb(0 0 0/.5);color:#fff;white-space:nowrap}
.st.F{background:rgb(255 255 255/.9);color:#111}
.flame{position:absolute;top:10px;right:10px;font:700 11px var(--mono);background:var(--hot);color:#fff;border-radius:6px;padding:2px 6px}
.badge{position:absolute;top:10px;left:10px;font:700 11px var(--body);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 7px;box-shadow:0 1px 3px rgb(0 0 0/.25)}
.cover .ttl.has-badge{margin-top:22px}
.info{min-width:0}
.info .name{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:10px;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats .sc{color:var(--ink);font-weight:600}
.why{font-size:12px;color:var(--muted);line-height:1.35}
.why b{color:var(--ink);font-weight:500}
.skel .cover{background:var(--sunk);animation:pulse 1.2s ease-in-out infinite alternate}
.skel .cover::before{display:none}
.skel .bar{height:12px;border-radius:4px;background:var(--sunk);width:80%}
@keyframes pulse{to{opacity:.55}}
.more{display:flex;justify-content:center;padding-bottom:56px}
.empty{padding:56px 0 80px;text-align:center;color:var(--muted);max-width:460px;margin:0 auto}
.empty h2{font:900 26px var(--display);font-stretch:75%;text-transform:uppercase;color:var(--ink);margin:0 0 6px}
.empty .btn{margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}

/* my list */
.shelf{display:grid;gap:28px;padding-bottom:48px}
.shelf h2{font:800 18px var(--display);font-stretch:80%;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.shelf h2 span{font:12px var(--mono);color:var(--muted)}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px}
.thumb{width:44px;height:62px;border-radius:5px;background:var(--c);border:0;padding:0;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.row .t{min-width:0;border:0;background:none;text-align:left;padding:0}
.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font:12px var(--mono);color:var(--muted)}
.prog{display:flex;align-items:center;gap:6px;font:13px var(--mono);font-variant-numeric:tabular-nums}
.prog button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:700}
.prog .plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* sheets & dialogs */
.scrim{position:fixed;inset:0;background:rgb(10 11 16/.55);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:21;background:var(--surface);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) 20px;
  box-shadow:-12px 0 40px rgb(0 0 0/.25);display:grid;gap:18px;align-content:start}
.sheet .close{justify-self:end;border:0;background:var(--sunk);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
.hero{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;align-items:end}
.hero .cover .ttl{font-size:16px}
.hero h2{margin:0;font:900 26px/1.02 var(--display);font-stretch:72%;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.hero .alt{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.kv div{background:var(--surface);padding:10px}
.kv dt{font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv dd{margin:2px 0 0;font:800 20px var(--display);font-stretch:80%;font-variant-numeric:tabular-nums}
.tagset{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk)}
.tag.g{background:none;border:1px solid var(--line)}
.tag.r{background:var(--ink);color:var(--paper)}
.synopsis{font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-line;max-height:9.6em;overflow:hidden;position:relative}
.synopsis.open{max-height:none}
.synopsis:not(.open)::after{content:"";position:absolute;inset:auto 0 0;height:3em;background:linear-gradient(transparent,var(--surface))}
.sect{display:grid;gap:8px}
.sect>label,.sect>.lbl{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.status-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.status-pick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;font-size:12px;display:grid;gap:1px;justify-items:center}
.status-pick button span{font:700 11px var(--body);color:var(--muted)}
.status-pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status-pick button[aria-pressed="true"] span{color:inherit;opacity:.8}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 0;font:600 13px var(--mono)}
.rate button.on{background:var(--hot);border-color:var(--hot);color:#fff}
.chap{display:flex;gap:8px;align-items:center}
.chap input{width:90px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-family:var(--mono)}
.reads{display:flex;flex-wrap:wrap;gap:6px}
.linkrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.linkrow a{color:var(--accent);font-weight:500}
.danger{color:var(--hot);border:0;background:none;padding:0;font-size:13px}
.dialog{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--surface);
  border-radius:16px;padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgb(0 0 0/.35)}
.dialog h3{margin:0;font:800 13px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dialog p{margin:0;font-size:14px;color:var(--muted)}
.dialog .acts{display:flex;gap:8px;flex-wrap:wrap}
.dialog .acts .btn{flex:1}
.spinbox{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:end}
.spinbox .cover .ttl{font-size:16px}
.pool{font:12px var(--mono);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
footer{font:12px var(--mono);color:var(--muted);padding-block:12px 32px;border-top:1px solid var(--line)}
footer a{color:inherit}
@media (max-width:560px){
  .brand h1{font-size:25px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .cover .ttl{font-size:18px}
  .rank{font-size:38px}
  .spin-btn{padding:9px 14px 9px 10px;font-size:14px}
  .row{grid-template-columns:44px minmax(0,1fr)}
  .row .prog{grid-column:2}
  .hero,.spinbox{grid-template-columns:104px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="mast-row">
      <div class="brand"><h1>Manhwa <b>Radar</b></h1><small id="asof">Loading AniList…</small></div>
      <button class="icon-btn" id="dataBtn" type="button">Data</button>
      <button class="spin-btn" id="spinBtn" type="button" aria-label="Surprise me with a random trending pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/></svg>
        Surprise me
      </button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <section class="filters" id="filters">
    <div class="frow">
      <form class="search" id="searchForm" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search titles or tags (murim, regression, villainess…)" aria-label="Search" autocomplete="off">
      </form>
      <div class="ctl" id="sortCtl"><label for="sort">Sort</label><select id="sort"></select></div>
      <div class="ctl"><label for="minScore">Min</label><select id="minScore">
        <option value="0">Any rating</option><option value="70">70%+</option><option value="75">75%+</option><option value="80">80%+</option><option value="85">85%+</option>
      </select></div>
    </div>
    <div class="frow">
      <div class="seg" id="statusSeg" role="group" aria-label="Publishing status"></div>
      <label class="toggle"><input type="checkbox" id="hideTracked"> Hide titles on my list</label>
    </div>
    <div class="chips" id="genres" role="group" aria-label="Genres"></div>
  </section>
  <div class="meta-line"><span id="count"></span><button class="linklike" id="clear" type="button" hidden>Clear filters</button></div>
  <div id="notice"></div>
  <section id="view"></section>
</main>
<footer><div class="wrap">Data and cover art from <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a>. Your list stays in this browser; back it up from Data → Export.</div></footer>

<div id="overlay"></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
/* ================= AniList API ================= */
const API = 'https://graphql.anilist.co';
const FIELDS = `id countryOfOrigin isAdult title{english romaji native} coverImage{large extraLarge color} genres
  tags{name rank isMediaSpoiler} averageScore popularity favourites trending status chapters startDate{year}
  description(asHtml:false) externalLinks{site url type} siteUrl`;
const Q_LIST = `query($page:Int,$sort:[MediaSort]){Page(page:$page,perPage:50){pageInfo{hasNextPage}
  media(type:MANGA,countryOfOrigin:KR,sort:$sort,isAdult:false){${FIELDS}}}}`;
const Q_SEARCH = `query($q:String,$page:Int){Page(page:$page,perPage:30){pageInfo{hasNextPage}
  media(type:MANGA,countryOfOrigin:KR,search:$q,isAdult:false,sort:SEARCH_MATCH){${FIELDS}}}}`;
const Q_RECS = `query($ids:[Int]){Page(perPage:12){media(id_in:$ids){id
  recommendations(sort:RATING_DESC,perPage:12){nodes{rating mediaRecommendation{${FIELDS}}}}}}}`;

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function gql(query, variables, tries = 3){
  for (let i = 0; i < tries; i++) {
    let res;
    try {
      res = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'}, body: JSON.stringify({query, variables})});
    } catch (e) { if (i === tries - 1) throw new Error('offline'); await sleep(1500); continue; }
    if (res.status === 429) { const wait = (+res.headers.get('Retry-After') || 30) * 1000; setNotice(`AniList asked us to slow down. Retrying in ${Math.round(wait/1000)}s…`); await sleep(wait); continue; }
    const j = await res.json().catch(() => null);
    if (!res.ok || !j || j.errors) { if (i === tries - 1) throw new Error((j && j.errors && j.errors[0].message) || ('HTTP ' + res.status)); await sleep(1500); continue; }
    return j.data;
  }
  throw new Error('failed');
}

/* ================= model ================= */
const STATUS = {RELEASING:['연재중','Ongoing','R'],FINISHED:['완결','Completed','F'],HIATUS:['휴재','Hiatus','R'],CANCELLED:['중단','Cancelled','F'],NOT_YET_RELEASED:['예정','Upcoming','N']};
const TRACK = [['plan','읽을 예정','Plan'],['reading','읽는 중','Reading'],['done','완독','Done'],['hold','보류','On hold'],['drop','하차','Dropped']];
const TRACK_NAME = Object.fromEntries(TRACK.map(t => [t[0], t[2]]));
const GENRES = ['Action','Adventure','Comedy','Drama','Fantasy','Horror','Mystery','Psychological','Romance','Sci-Fi','Slice of Life','Sports','Supernatural','Thriller','Music'];
const SOURCES = [
  {k:'trending',ko:'급상승',en:'Trending',sort:'TRENDING_DESC',pages:2},
  {k:'top',ko:'평점',en:'Top rated',sort:'SCORE_DESC',pages:2},
  {k:'popular',ko:'인기',en:'Popular',sort:'POPULARITY_DESC',pages:4},
  {k:'all',ko:'전체',en:'Browse all'},
  {k:'mine',ko:'내 서재',en:'My list'},
  {k:'foryou',ko:'추천',en:'For you'},
];
const SORTS = [['rank','List rank'],['score','Rating'],['pop','Popularity'],['trend','Trending now'],['fav','Favourites'],['year','Newest'],['ch','Most chapters'],['az','Title A–Z']];
const READ_SITES = /webtoon|tapas|tappytoon|lezhin|pocket comics|manta|kakao|naver|ridi|bomtoon|toomics|tooncraft|piccoma|comikey|inkr|copin|yen press|tapastic/i;

function hashHue(n){ return (n * 137.508) % 360; }
function lum(hex){ const h = hex.replace('#',''); const v = [0,2,4].map(i => parseInt(h.slice(i,i+2),16)/255).map(c => c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055,2.4)); return .2126*v[0]+.7152*v[1]+.0722*v[2]; }
function cleanDesc(s){
  if (!s) return '';
  return s.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&quot;/g,'"').replace(/&#039;|&apos;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/\n{3,}/g,'\n\n').replace(/\(Source:[^)]*\)\s*$/i,'').trim();
}
function norm(x){
  const color = x.coverImage && x.coverImage.color;
  const st = STATUS[x.status] || ['','Unknown','N'];
  return {
    id:x.id, title:x.title.english || x.title.romaji, alt:x.title.english ? x.title.romaji : '', native:x.title.native || '',
    c: color || `hsl(${hashHue(x.id)} 50% 42%)`, ci: color && lum(color) > .38 ? '#121318' : '#ffffff',
    cover:(x.coverImage && (x.coverImage.large || x.coverImage.extraLarge)) || '', coverXL:(x.coverImage && x.coverImage.extraLarge) || '',
    genres:x.genres || [], tags:(x.tags||[]).filter(t => !t.isMediaSpoiler && t.rank >= 60).slice(0,6).map(t => t.name),
    score:x.averageScore || 0, pop:x.popularity || 0, fav:x.favourites || 0, trend:x.trending || 0,
    status:st[2], statusKo:st[0], statusEn:st[1], ch:x.chapters || 0, year:(x.startDate && x.startDate.year) || 0,
    desc:cleanDesc(x.description),
    links:(x.externalLinks||[]).filter(l => l.url && (READ_SITES.test(l.site) || l.type === 'STREAMING')).map(l => ({site:l.site, url:l.url})).slice(0,6),
  };
}
function compact(m){ const {desc, links, coverXL, ...rest} = m; return rest; } // what we keep inside list entries

const CAT = new Map();            // id -> media
const LISTS = {trending:[], top:[], popular:[]};
const RANK = {trending:new Map(), top:new Map(), popular:new Map()};
const SEARCH = {q:'', ids:[], loading:false, hasNext:false, page:0};
let fetchedAt = 0, loadingCatalog = false, loadError = '';
function addMedia(list){ const ids = []; for (const x of list) { if (x.countryOfOrigin && x.countryOfOrigin !== 'KR') continue; if (x.isAdult) continue; const m = norm(x); CAT.set(m.id, m); ids.push(m.id); } return ids; }
function hay(m){ return m._h || (m._h = (m.title+' '+m.alt+' '+m.native+' '+m.tags.join(' ')+' '+m.genres.join(' ')).toLowerCase()); }

/* ================= cache ================= */
const CACHE_KEY = 'manhwa-radar-cache-v2', LIST_KEY = 'manhwa-radar-list-v1', TTL = 6 * 3600e3;
function saveCache(){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({at:fetchedAt, lists:LISTS, media:[...CAT.values()].filter(m => LISTS.trending.includes(m.id) || LISTS.top.includes(m.id) || LISTS.popular.includes(m.id)).map(({_h, ...m}) => m)})); }
  catch { try { localStorage.removeItem(CACHE_KEY); } catch {} }
}
function loadCache(){
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (!c) return false;
    c.media.forEach(m => CAT.set(m.id, m)); Object.assign(LISTS, c.lists); rebuildRanks(); fetchedAt = c.at; return true; } catch { return false; }
}
function rebuildRanks(){ for (const k of Object.keys(LISTS)) RANK[k] = new Map(LISTS[k].map((id,i) => [id, i+1])); }

async function loadCatalog(force){
  if (loadingCatalog) return; loadingCatalog = true; loadError = '';
  setNotice(''); renderAsOf();
  const fresh = {trending:[], top:[], popular:[]};
  try {
    for (const s of SOURCES.filter(s => s.sort)) {
      for (let p = 1; p <= s.pages; p++) {
        const d = await gql(Q_LIST, {page:p, sort:[s.sort]});
        fresh[s.k].push(...addMedia(d.Page.media));
        if (!force) { LISTS[s.k] = [...new Set(fresh[s.k])]; rebuildRanks(); scheduleRender(); }
        if (!d.Page.pageInfo.hasNextPage) break;
        await sleep(350);
      }
      LISTS[s.k] = [...new Set(fresh[s.k])]; rebuildRanks(); scheduleRender();
    }
    fetchedAt = Date.now(); saveCache();
  } catch (e) {
    let framed = false; try { framed = window.self !== window.top; } catch { framed = true; }
    loadError = e.message !== 'offline' ? 'AniList returned an error: ' + e.message + '.'
      : framed ? 'This preview window blocks connections to AniList. Download the file and open it directly in Chrome, Edge, Firefox or Safari.'
      : navigator.onLine === false ? 'You’re offline. Reconnect and try again.'
      : 'Your browser couldn’t reach graphql.anilist.co. An ad blocker, Brave Shields or a school or office network filter is the usual cause: allow that site, or try another network.';
    setNotice(loadError + (CAT.size ? ' Showing the last saved data.' : ''), 'Try again', () => loadCatalog(true));
  } finally { loadingCatalog = false; renderAsOf(); render(); }
}
async function runSearch(q, more){
  q = q.trim(); if (q.length < 2) return;
  if (!more) { SEARCH.q = q; SEARCH.ids = []; SEARCH.page = 0; }
  SEARCH.loading = true; render();
  try {
    const d = await gql(Q_SEARCH, {q, page: SEARCH.page + 1});
    if (SEARCH.q !== q) return;
    SEARCH.page++; SEARCH.hasNext = d.Page.pageInfo.hasNextPage;
    SEARCH.ids = [...new Set([...SEARCH.ids, ...addMedia(d.Page.media)])];
  } catch (e) { toast('Search failed. Check your connection and try again.'); }
  finally { SEARCH.loading = false; render(); }
}

/* ================= your list (localStorage) ================= */
let store = {};
try { store = JSON.parse(localStorage.getItem(LIST_KEY) || '{}') || {}; } catch { store = {}; }
function saveList(){ try { localStorage.setItem(LIST_KEY, JSON.stringify(store)); } catch { toast('Your browser refused to save. Free some storage or export your list.'); } }
function media(id){ return CAT.get(id) || (store[id] && store[id].m) || null; }
function setEntry(id, patch){
  const m = media(id); if (!m) return;
  const prev = store[id] || {s:'plan', ch:0};
  store[id] = {...prev, ...patch, t:Date.now(), m:compact(CAT.get(id) || prev.m)};
  saveList(); render(); if (openId === id) openSheet(id);
}
function untrack(id){ delete store[id]; saveList(); render(); if (openId === id) openSheet(id); toast('Removed from your list'); }

/* ================= state & helpers ================= */
const S = {src:'trending', q:'', genres:new Set(), status:'any', min:0, sort:'rank', hide:false};
try { const saved = JSON.parse(localStorage.getItem('manhwa-radar-view') || 'null'); if (saved && SOURCES.some(s => s.k === saved.src)) { S.src = saved.src; S.sort = saved.sort || S.sort; } } catch {}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kfmt = n => n >= 1000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/,'') + 'k' : String(n);
const scoreTxt = m => m.score ? m.score + '%' : '—';
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
let noticeAction = null;
function setNotice(msg, actionLabel, action){
  noticeAction = action || null;
  $('#notice').innerHTML = msg ? `<div class="notice"><span>${esc(msg)}</span>${actionLabel ? `<button class="btn" type="button" data-notice>${esc(actionLabel)}</button>` : ''}</div>` : '';
}
function renderAsOf(){
  const el = $('#asof');
  if (loadingCatalog && !fetchedAt) { el.textContent = 'Loading AniList…'; return; }
  if (loadingCatalog) { el.textContent = 'Refreshing from AniList…'; return; }
  if (!fetchedAt) { el.textContent = 'AniList · offline'; return; }
  const mins = Math.round((Date.now() - fetchedAt) / 60000);
  el.textContent = 'AniList · updated ' + (mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : Math.round(mins/60) + ' h ago');
}
let rT; function scheduleRender(){ cancelAnimationFrame(rT); rT = requestAnimationFrame(render); }
document.addEventListener('load', e => { if (e.target.tagName === 'IMG' && e.target.dataset.cover != null) { e.target.classList.add('ok'); e.target.parentElement.classList.add('has-img'); } }, true);
document.addEventListener('error', e => { if (e.target.tagName === 'IMG' && e.target.dataset.cover != null) e.target.remove(); }, true);

function coverHTML(m, opts = {}){
  const rank = opts.rank ? `<span class="rank"><sup>#</sup>${opts.rank}</span>` : '<span></span>';
  const tr = store[m.id];
  const badge = tr ? `<span class="badge">${esc(TRACK_NAME[tr.s] || '')}</span>` : '';
  const flame = opts.flame && m.trend >= 5 ? `<span class="flame" title="Recent activity on AniList">▲ ${m.trend}</span>` : '';
  const src = opts.xl && m.coverXL ? m.coverXL : m.cover;
  return `<div class="cover" style="--c:${m.c};--ci:${m.ci}">${src ? `<img data-cover src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : ''}${badge}${flame}
    <div class="ttl${badge ? ' has-badge' : ''}">${esc(m.title)}</div>
    ${opts.bare ? '' : `<div class="foot">${rank}<span class="st ${m.status}">${esc(m.statusKo)} · ${esc(m.statusEn)}</span></div>`}</div>`;
}
function cardHTML(m, rank, extra = ''){
  const chap = (m.status === 'F' && m.ch) ? `${m.ch} ch` : (m.year ? `since ${m.year}` : '');
  return `<button class="card" type="button" data-open="${m.id}">
    ${coverHTML(m, {rank, flame: S.src === 'trending'})}
    <div class="info"><div class="name">${esc(m.title)}</div><div class="sub">${esc(m.genres.slice(0,3).join(' · '))}</div></div>
    <div class="stats"><span class="sc">★ ${scoreTxt(m)}</span><span>${kfmt(m.pop)} lists</span><span>${chap}</span></div>${extra}
  </button>`;
}
const SKELETON = `<div class="grid">${Array.from({length:12}, () => `<div class="card skel" aria-hidden="true"><div class="cover"></div><div class="bar"></div><div class="bar" style="width:50%"></div></div>`).join('')}</div>`;

/* ================= filtering & sorting ================= */
function applyFilters(list){
  const q = S.q.trim().toLowerCase();
  return list.filter(m => m &&
    (!q || hay(m).includes(q)) &&
    [...S.genres].every(g => m.genres.includes(g)) &&
    (S.status === 'any' || m.status === S.status) &&
    m.score >= S.min &&
    (!S.hide || !store[m.id]));
}
function sortList(list){
  const r = RANK[S.src];
  const by = {
    rank: (a,b) => r ? (r.get(a.id)||1e9) - (r.get(b.id)||1e9) : b.score - a.score || b.pop - a.pop,
    score: (a,b) => b.score - a.score || b.pop - a.pop, pop: (a,b) => b.pop - a.pop,
    trend: (a,b) => b.trend - a.trend || b.pop - a.pop, fav: (a,b) => b.fav - a.fav,
    year: (a,b) => b.year - a.year || b.pop - a.pop, ch: (a,b) => b.ch - a.ch,
    az: (a,b) => a.title.localeCompare(b.title),
  }[S.sort] || ((a,b) => b.score - a.score);
  return [...list].sort(by);
}
function sourceList(src){ return src === 'all' ? [...CAT.values()] : (LISTS[src] || []).map(id => CAT.get(id)).filter(Boolean); }
function filtersActive(){ return !!(S.q || S.genres.size || S.status !== 'any' || S.min || S.hide); }

/* ================= recommendations ================= */
const RECS = {key:'', byId:new Map(), loading:false};
function likedEntries(){
  return Object.entries(store).filter(([,e]) => e.s !== 'drop' && !(e.r && e.r <= 4) && (e.s === 'done' || e.s === 'reading' || (e.r && e.r >= 7)))
    .map(([id,e]) => ({m:media(+id), w: e.r ? (e.r - 4) / 3 : 1})).filter(x => x.m).sort((a,b) => b.w - a.w);
}
async function loadRecs(){
  const liked = likedEntries().slice(0, 12); const key = liked.map(x => x.m.id).join(',');
  if (!liked.length || RECS.key === key || RECS.loading) return;
  RECS.loading = true;
  try {
    const d = await gql(Q_RECS, {ids: liked.map(x => x.m.id)});
    const by = new Map();
    for (const src of d.Page.media) for (const n of src.recommendations.nodes) {
      const x = n.mediaRecommendation; if (!x || x.countryOfOrigin !== 'KR' || x.isAdult) continue;
      addMedia([x]);
      const cur = by.get(x.id) || {votes:0, from:[]};
      cur.votes += Math.max(1, n.rating || 0); cur.from.push(src.id); by.set(x.id, cur);
    }
    RECS.byId = by; RECS.key = key;
  } catch { /* fall back to local similarity */ }
  finally { RECS.loading = false; if (S.src === 'foryou') render(); }
}
function forYou(){
  const liked = likedEntries(); if (!liked.length) return null;
  const SKIP = new Set(['Full Color','Male Protagonist','Female Protagonist','Long Strip']);
  const gw = {}, tw = {};
  for (const {m,w} of liked) { m.genres.forEach(g => gw[g] = (gw[g]||0) + w); m.tags.forEach(t => { if (!SKIP.has(t)) tw[t] = (tw[t]||0) + w*1.6; }); }
  const out = [];
  for (const m of CAT.values()) {
    if (store[m.id] || !m.score) continue;
    let s = 0; m.genres.forEach(g => s += gw[g]||0); m.tags.forEach(t => s += tw[t]||0);
    s = s / Math.sqrt(m.genres.length + m.tags.length + 1) * Math.pow(m.score/80, 3) * (1 + Math.log10(m.pop + 10)/10);
    const rec = RECS.byId.get(m.id);
    if (rec) s += 6 + Math.log2(1 + rec.votes) * 3;
    if (s <= 0) continue;
    let best = null, why = '';
    if (rec) { best = media(rec.from[0]); why = 'AniList readers recommend it'; }
    else { let bo = 0; for (const {m:l} of liked) { const o = l.genres.filter(g => m.genres.includes(g)).length + 2*l.tags.filter(t => m.tags.includes(t) && !SKIP.has(t)).length; if (o > bo) { bo = o; best = l; } }
      if (best) why = best.tags.filter(t => m.tags.includes(t) && !SKIP.has(t)).slice(0,2).join(', '); }
    out.push({m, s, best, why});
  }
  return out.sort((a,b) => b.s - a.s);
}

/* ================= render ================= */
function renderTabs(){
  const n = Object.keys(store).length;
  $('#tabs').innerHTML = SOURCES.map(s => `<button class="tab" role="tab" type="button" data-src="${s.k}" aria-selected="${S.src === s.k}">
    <span class="ko">${s.ko}</span><span class="en">${s.en}</span>${s.k === 'mine' && n ? `<span class="n">${n}</span>` : ''}</button>`).join('');
}
function renderControls(){
  $('#sort').innerHTML = SORTS.filter(([k]) => k !== 'rank' || RANK[S.src]).map(([k,l]) => `<option value="${k}"${S.sort === k ? ' selected' : ''}>${l}</option>`).join('');
  $('#statusSeg').innerHTML = [['any','Any status'],['R','연재중 Ongoing'],['F','완결 Completed']].map(([k,l]) => `<button type="button" data-status="${k}" aria-pressed="${S.status === k}">${l}</button>`).join('');
  $('#genres').innerHTML = GENRES.map(g => `<button class="chip" type="button" data-genre="${g}" aria-pressed="${S.genres.has(g)}">${g}</button>`).join('');
  $('#minScore').value = String(S.min);
  $('#hideTracked').checked = S.hide;
  $('#clear').hidden = !filtersActive();
  $('#filters').hidden = S.src === 'mine';
  $('#sortCtl').hidden = S.src === 'foryou';
}
function render(){
  renderTabs(); renderControls();
  try { localStorage.setItem('manhwa-radar-view', JSON.stringify({src:S.src, sort:S.sort})); } catch {}
  const v = $('#view');
  if (S.src === 'mine') return renderMine(v);
  if (S.src === 'foryou') return renderForYou(v);
  const base = sourceList(S.src);
  if (!base.length) { $('#count').textContent = ''; v.innerHTML = loadingCatalog || !loadError ? SKELETON : ''; return; }
  const list = sortList(applyFilters(base));
  const label = {trending:'trending on AniList now', top:'highest rated', popular:'most read', all:'Korean titles loaded'}[S.src];
  $('#count').textContent = `${list.length} of ${base.length} ${label}`;
  const q = S.q.trim();
  const searchMore = q.length >= 2 ? (SEARCH.q === q && !SEARCH.loading
      ? (SEARCH.hasNext ? `<button class="btn" type="button" data-search-more>Load more AniList results for “${esc(q)}”</button>` : '')
      : `<button class="btn primary" type="button" data-search ${SEARCH.loading ? 'disabled' : ''}>${SEARCH.loading ? 'Searching AniList…' : `Search all of AniList for “${esc(q)}”`}</button>`) : '';
  if (!list.length) {
    v.innerHTML = `<div class="empty"><h2>Nothing matches</h2><p>${q ? `No loaded title matches “${esc(q)}” with these filters.` : 'No titles fit every filter you picked. Remove a genre or lower the minimum rating.'}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${searchMore}<button class="btn" type="button" data-clear>Clear filters</button></div></div>`;
    return;
  }
  const r = RANK[S.src];
  v.innerHTML = `<div class="grid">${list.map(m => cardHTML(m, r ? r.get(m.id) : 0)).join('')}</div>${searchMore ? `<div class="more">${searchMore}</div>` : ''}`;
}
function renderMine(v){
  const entries = Object.entries(store).map(([id,e]) => ({m:media(+id), e})).filter(x => x.m);
  $('#count').textContent = entries.length ? `${entries.length} titles on your list` : '';
  if (!entries.length) {
    v.innerHTML = `<div class="empty"><h2>Your list is empty</h2><p>Open any title and pick Plan, Reading or Done to start tracking. Chapter progress and your ratings show up here.</p><button class="btn primary" type="button" data-src="trending">See what’s trending</button></div>`;
    return;
  }
  v.innerHTML = `<div class="shelf">${TRACK.map(([k,ko,en]) => {
    const rows = entries.filter(x => x.e.s === k).sort((a,b) => (b.e.t||0) - (a.e.t||0));
    if (!rows.length) return '';
    return `<section><h2>${ko} · ${en} <span>${rows.length}</span></h2><div class="rows">${rows.map(({m,e}) => `
      <div class="row">
        <button class="thumb" type="button" style="--c:${m.c}" data-open="${m.id}" aria-label="Open ${esc(m.title)}">${m.cover ? `<img src="${esc(m.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</button>
        <button class="t" type="button" data-open="${m.id}"><b>${esc(m.title)}</b><small>★ ${scoreTxt(m)} · ${esc(m.statusEn)}${m.ch ? ' · ' + m.ch + ' ch' : ''}${e.r ? ' · you: ' + e.r + '/10' : ''}</small></button>
        <div class="prog"><button type="button" data-step="${m.id}" data-d="-1" aria-label="One chapter back">−</button><span>ch ${e.ch||0}${m.ch ? '/' + m.ch : ''}</span><button class="plus" type="button" data-step="${m.id}" data-d="1" aria-label="Read one more chapter">+</button></div>
      </div>`).join('')}</div></section>`;
  }).join('')}</div>`;
}
function renderForYou(v){
  const recs = forYou();
  if (!recs) {
    $('#count').textContent = '';
    v.innerHTML = `<div class="empty"><h2>Tell us what you liked</h2><p>Mark a few titles as Reading or Done, or rate them 7 and up. Picks here blend AniList reader recommendations with the genres and tags you enjoy.</p><button class="btn primary" type="button" data-src="top">Start with the top rated</button></div>`;
    return;
  }
  loadRecs();
  const keep = new Set(applyFilters(recs.map(x => x.m)).map(m => m.id));
  const shown = recs.filter(x => keep.has(x.m.id)).slice(0, 36);
  $('#count').textContent = `${shown.length} picks based on ${likedEntries().length} titles you liked${RECS.loading ? ' · asking AniList…' : ''}`;
  if (!shown.length) { v.innerHTML = `<div class="empty"><h2>Nothing matches</h2><p>Your filters rule out every pick. Clear them to see recommendations.</p><button class="btn" type="button" data-clear>Clear filters</button></div>`; return; }
  v.innerHTML = `<div class="grid">${shown.map(({m,best,why}) => cardHTML(m, 0, best ? `<div class="why">Because you liked <b>${esc(best.title)}</b>${why ? ' · ' + esc(why) : ''}</div>` : '')).join('')}</div>`;
}

/* ================= detail sheet ================= */
let openId = null, lastFocus = null;
function openSheet(id){
  const m = media(id); if (!m) return;
  if (openId !== id) lastFocus = document.activeElement;
  openId = id; const e = store[id];
  const ranks = ['trending','top','popular'].filter(k => RANK[k].get(id)).map(k => `#${RANK[k].get(id)} ${{trending:'trending',top:'top rated',popular:'popular'}[k]}`);
  $('#overlay').innerHTML = `<div class="scrim" data-close></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.title)}">
    <button class="close" type="button" data-close aria-label="Close">×</button>
    <div class="hero">${coverHTML(m, {xl:true})}<div><h2>${esc(m.title)}</h2>${m.native ? `<div class="alt">${esc(m.native)}</div>` : ''}${m.alt ? `<div class="alt">${esc(m.alt)}</div>` : ''}
      <div class="alt">${esc(m.statusKo)} ${esc(m.statusEn)}${m.year ? ' · started ' + m.year : ''}${m.ch ? ' · ' + m.ch + ' chapters' : ''}</div></div></div>
    <dl class="kv"><div><dt>Rating</dt><dd>${scoreTxt(m)}</dd></div><div><dt>On lists</dt><dd>${kfmt(m.pop)}</dd></div><div><dt>Favourites</dt><dd>${kfmt(m.fav)}</dd></div></dl>
    ${ranks.length ? `<div class="tagset">${ranks.map(r => `<span class="tag r">${r}</span>`).join('')}</div>` : ''}
    <div class="tagset">${m.genres.map(g => `<span class="tag g">${esc(g)}</span>`).join('')}${m.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    ${m.desc ? `<div class="sect"><span class="lbl">Synopsis</span><div class="synopsis" id="syn">${esc(m.desc)}</div><button class="linklike" type="button" data-syn style="justify-self:start">Read more</button></div>` : ''}
    <div class="sect"><span class="lbl">Track it</span>
      <div class="status-pick">${TRACK.map(([k,ko,en]) => `<button type="button" data-track="${k}" aria-pressed="${!!e && e.s === k}">${en}<span>${ko}</span></button>`).join('')}</div></div>
    ${e ? `<div class="sect"><label for="chIn">Chapters read</label><div class="chap prog">
        <button type="button" data-step="${id}" data-d="-1" aria-label="One chapter back">−</button>
        <input id="chIn" type="number" min="0" inputmode="numeric" value="${e.ch||0}">
        <button class="plus" type="button" data-step="${id}" data-d="1" aria-label="Read one more chapter">+</button>
        <span style="color:var(--muted)">${m.ch ? 'of ' + m.ch : 'ongoing'}</span></div></div>
      <div class="sect"><span class="lbl">Your rating</span><div class="rate">${Array.from({length:10}, (_,i) => `<button type="button" data-rate="${i+1}" class="${e.r && i+1 <= e.r ? 'on' : ''}" aria-label="Rate ${i+1} out of 10">${i+1}</button>`).join('')}</div></div>` : ''}
    ${m.links && m.links.length ? `<div class="sect"><span class="lbl">Where to read</span><div class="reads">${m.links.map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.site)} ↗</a>`).join('')}</div></div>` : ''}
    <div class="linkrow"><a href="https://anilist.co/manga/${id}" target="_blank" rel="noopener">Open on AniList ↗</a>
      ${e ? `<button class="danger" type="button" data-untrack>Remove from my list</button>` : ''}</div>
  </aside>`;
  const ch = $('#chIn'); if (ch) ch.addEventListener('change', () => setEntry(id, {ch: Math.max(0, parseInt(ch.value || '0', 10) || 0)}));
  const syn = $('#syn'); if (syn && syn.scrollHeight <= syn.clientHeight + 4) { syn.classList.add('open'); $('[data-syn]').remove(); }
  if (!document.activeElement || !$('#overlay').contains(document.activeElement)) $('.sheet .close').focus();
}
function closeOverlay(){
  $('#overlay').innerHTML = ''; spinning = false;
  if (openId != null && lastFocus && document.contains(lastFocus)) lastFocus.focus();
  openId = null;
}

/* ================= surprise me ================= */
let spinning = false;
function spinPool(){
  return applyFilters([...CAT.values()]).filter(m => !store[m.id] && m.score >= 60)
    .map(m => ({m, w: Math.pow(m.trend + 1, .85) * Math.pow(m.score/75, 4) * Math.log10(m.pop + 10)}));
}
function pick(pool){ const tot = pool.reduce((a,x) => a + x.w, 0); let r = Math.random() * tot; for (const x of pool) { r -= x.w; if (r <= 0) return x.m; } return pool[pool.length-1].m; }
function spin(){
  const pool = spinPool();
  if (!pool.length) { toast(CAT.size ? 'No untracked titles match your filters. Clear a filter and try again.' : 'Still loading titles from AniList…'); return; }
  const final = pick(pool); spinning = true; openId = null;
  const draw = (m, done) => {
    $('#overlay').innerHTML = `<div class="scrim" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-label="Random pick">
      <h3>${done ? 'Your next read' : 'Rolling…'}</h3>
      <div class="spinbox">${coverHTML(m, {bare:true})}<div class="info"><div class="name" style="font-size:18px">${esc(m.title)}</div><div class="sub">${esc(m.genres.join(' · '))}</div>
        <div class="stats" style="margin-top:6px"><span class="sc">★ ${scoreTxt(m)}</span><span>${kfmt(m.pop)} lists</span>${m.trend >= 5 ? `<span style="color:var(--hot)">▲ trending</span>` : ''}</div></div></div>
      ${done ? `<div class="pool">Picked from ${pool.length} untracked titles${filtersActive() ? ' matching your filters' : ''}, weighted toward what’s trending and well rated.</div>
        <div class="acts"><button class="btn primary" type="button" data-spin-add="${m.id}">Add to Plan</button><button class="btn" type="button" data-open="${m.id}">Details</button><button class="btn" type="button" data-spin-again>Roll again</button></div>` : ''}
    </div>`;
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(final, true); return; }
  let i = 0; const steps = 14;
  const tick = () => {
    if (!spinning) return;
    if (i >= steps) { draw(final, true); const b = $('[data-spin-add]'); if (b) b.focus(); return; }
    draw(pool[Math.floor(Math.random() * pool.length)].m, false);
    i++; setTimeout(tick, 45 + i * i * 1.6);
  };
  tick();
}

/* ================= data panel: refresh, export, import ================= */
function openData(){
  openId = null;
  const n = Object.keys(store).length;
  $('#overlay').innerHTML = `<div class="scrim" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-label="Your data">
    <h3>Your data</h3>
    <p>${n} title${n === 1 ? '' : 's'} on your list, saved in this browser. Export a backup file to keep it safe or to move it to another device.</p>
    <div class="acts"><button class="btn primary" type="button" data-export>Export list</button><button class="btn" type="button" data-import>Import list</button></div>
    <p>Catalog: ${CAT.size} titles. ${fetchedAt ? 'Last refreshed ' + new Date(fetchedAt).toLocaleString() + '.' : 'Not loaded yet.'} It refreshes automatically every 6 hours.</p>
    <div class="acts"><button class="btn" type="button" data-refresh ${loadingCatalog ? 'disabled' : ''}>${loadingCatalog ? 'Refreshing…' : 'Refresh from AniList now'}</button></div>
    <div class="acts"><button class="btn" type="button" data-close>Done</button></div>
  </div>`;
}
function exportList(){
  const blob = new Blob([JSON.stringify({app:'manhwa-radar', version:1, exported:new Date().toISOString(), list:store}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `manhwa-radar-list-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Exported ' + Object.keys(store).length + ' titles');
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const list = j && j.list;
    if (!list || typeof list !== 'object') throw 0;
    let added = 0, updated = 0;
    for (const [id, en] of Object.entries(list)) {
      if (!en || !en.s || !en.m) continue;
      if (!store[id]) { store[id] = en; added++; } else if ((en.t||0) > (store[id].t||0)) { store[id] = en; updated++; }
    }
    saveList(); render(); closeOverlay(); toast(`Imported: ${added} new, ${updated} updated`);
  } catch { toast('That file isn’t a Manhwa Radar backup. Pick a file made with Export.'); }
});

/* ================= events ================= */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-close]'); if (!t) return;
  const d = t.dataset;
  if (d.src) { S.src = d.src; S.sort = RANK[S.src] ? 'rank' : (S.sort === 'rank' ? 'score' : S.sort); closeOverlay(); render(); scrollTo({top:0}); return; }
  if (d.open) { openSheet(+d.open); return; }
  if ('close' in d) { closeOverlay(); return; }
  if (d.genre) { S.genres.has(d.genre) ? S.genres.delete(d.genre) : S.genres.add(d.genre); render(); return; }
  if (d.status) { S.status = d.status; render(); return; }
  if ('clear' in d || t.id === 'clear') { S.q = ''; $('#q').value = ''; S.genres.clear(); S.status = 'any'; S.min = 0; S.hide = false; render(); return; }
  if ('search' in d) { runSearch(S.q); return; }
  if ('searchMore' in d) { runSearch(SEARCH.q, true); return; }
  if (d.track) { const had = store[openId]; const m = media(openId); setEntry(openId, {s:d.track, ...(d.track === 'done' && m.ch ? {ch:m.ch} : {})}); if (!had) toast('Added to ' + TRACK_NAME[d.track]); return; }
  if (d.rate) { const v = +d.rate; setEntry(openId, {r: store[openId].r === v ? 0 : v}); return; }
  if ('untrack' in d) { untrack(openId); return; }
  if ('syn' in d) { $('#syn').classList.add('open'); t.remove(); return; }
  if (d.step) { const id = +d.step, m = media(id), e = store[id]; let ch = Math.max(0, (e.ch||0) + (+d.d)); if (m.ch) ch = Math.min(ch, m.ch);
    const patch = {ch}; if (m.ch && ch === m.ch && e.s !== 'done') { patch.s = 'done'; toast('Finished! Moved to Done'); } else if (e.s === 'plan' && ch > 0) patch.s = 'reading';
    setEntry(id, patch); return; }
  if (d.spinAdd) { setEntry(+d.spinAdd, {s:'plan'}); closeOverlay(); toast('Added to Plan'); return; }
  if ('spinAgain' in d) { spin(); return; }
  if ('export' in d) { exportList(); return; }
  if ('import' in d) { $('#importFile').click(); return; }
  if ('refresh' in d) { closeOverlay(); loadCatalog(true); return; }
  if ('notice' in d && noticeAction) { noticeAction(); return; }
});
$('#spinBtn').addEventListener('click', spin);
$('#dataBtn').addEventListener('click', openData);
$('#sort').addEventListener('change', e => { S.sort = e.target.value; render(); });
$('#minScore').addEventListener('change', e => { S.min = +e.target.value; render(); });
$('#hideTracked').addEventListener('change', e => { S.hide = e.target.checked; render(); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; render(); }, 120); });
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); S.q = $('#q').value; if (S.src === 'mine') S.src = 'all'; runSearch(S.q); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay').innerHTML) closeOverlay(); });
setInterval(renderAsOf, 60000);

/* ================= boot ================= */
const hadCache = loadCache();
render(); renderAsOf();
if (!hadCache || Date.now() - fetchedAt > TTL) loadCatalog(hadCache);
})();
</script>
</body>
</html>
